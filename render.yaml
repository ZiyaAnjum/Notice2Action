services:
  - type: web
    name: notice-to-action-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_UPLOAD_MAX
        value: "10"
      - key: RATE_LIMIT_UPLOAD_WINDOW_SEC
        value: "60"
      - key: DISABLE_SQLALCHEMY_C_EXTENSIONS
        value: "1"
    healthCheckPath: /api/health
