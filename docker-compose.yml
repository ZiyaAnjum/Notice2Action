services:
  db:
    image: postgres:16-alpine
    container_name: notice_to_action_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notice_password}
      POSTGRES_DB: ${POSTGRES_DB:-notice_to_action_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notice_user -d notice_to_action_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
